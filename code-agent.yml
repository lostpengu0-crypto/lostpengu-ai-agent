name: LostPengu Code Agent
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: LostPengu Code Agent Working
        run: |
          echo "========================================"
          echo "🐧 LostPengu Code Agent is Active"
          echo "Time: $(date)"
          echo "========================================"
          
          # Basit değişiklik
          echo "\n## 🔄 Auto Update - $(date)" >> README.md
          echo "- Maintenance completed by LostPengu Code Agent" >> README.md
          echo "- The colony continues to evolve." >> README.md
          
          echo "Changes made."
        shell: bash

      - name: Commit Changes
        run: |
          git config user.name "LostPengu Code Agent"
          git config user.email "agent@lostpengu.ai"
          git add README.md
          git commit -m "🤖 Auto maintenance by LostPengu Code Agent" || echo "No changes to commit"
          git push
        shell: bash
