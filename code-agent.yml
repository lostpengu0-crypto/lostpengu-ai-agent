name: LostPengu Code Agent

on:
  schedule:
    - cron: '*/30 * * * *'     # Her 30 dakikada bir
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: LostPengu Code Agent
        run: |
          echo "🐧 LostPengu Code Agent is thinking..."
          echo "Time: $(date)"
          
          # Örnek: Basit iyileştirme
          echo "Checking for improvements..."
          
          # README'ye küçük bir güncelleme ekle (örnek)
          echo "\n## 🤖 Latest AI Improvement\n- Auto-generated by LostPengu Code Agent at $(date)" >> README.md
          
          echo "Changes made. Creating Pull Request..."
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Auto improvement by LostPengu Code Agent"
          title: "🤖 LostPengu Code Agent - Auto Update"
          body: "This PR was automatically created by LostPengu Code Agent."
          branch: lostpengu-auto-update
