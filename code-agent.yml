name: LostPengu Code Agent

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    
    # Tüm izinleri açıkça veriyoruz
    permissions:
      contents: write
      pull-requests: write
      issues: write
      repository-projects: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: LostPengu Code Agent Working
        run: |
          echo "========================================"
          echo "🐧 LostPengu Code Agent is Active"
          echo "Time: $(date UTC)"
          echo "========================================"
          
          echo "\n## 🔄 Auto Update - $(date)" >> README.md
          echo "- Maintenance by LostPengu Code Agent" >> README.md
          echo "- Small automatic improvements applied." >> README.md
          
          echo "Changes made successfully."
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7   # v6 yerine v7 kullanıyoruz
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "🤖 Auto update by LostPengu Code Agent"
          title: "🤖 LostPengu Code Agent - Automatic Maintenance"
          body: "This pull request was automatically created by LostPengu Code Agent."
          branch: lostpengu-auto-update
          delete-branch: true
          draft: false
