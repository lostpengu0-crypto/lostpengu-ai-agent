name: LostPengu Code Agent

on:
  schedule:
    - cron: '*/30 * * * *'     # Runs every 30 minutes
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: LostPengu Code Agent Working
        run: |
          echo "========================================"
          echo "🐧 LostPengu Code Agent is Active"
          echo "========================================"
          echo "Time: $(date)"
          echo ""
          echo "Looking for improvements in the project..."
          
          # Automatic small improvement
          echo "\n## 🔄 Auto Update - $(date)" >> README.md
          echo "- Maintenance task completed by LostPengu Code Agent" >> README.md
          echo "- Small automatic improvements applied." >> README.md
          
          echo "Changes made. Creating Pull Request..."
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Auto update by LostPengu Code Agent"
          title: "🤖 LostPengu Code Agent - Automatic Maintenance"
          body: "This pull request was automatically created by LostPengu Code Agent."
          branch: lostpengu-auto-update
          delete-branch: true
