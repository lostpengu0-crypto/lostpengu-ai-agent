name: LostPengu Code Agent

on:
  schedule:
    - cron: '*/30 * * * *'     # Her 30 dakikada bir otomatik çalışır
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: LostPengu Code Agent Working
        run: |
          echo "🐧 LostPengu Code Agent is active - $(date)"
          echo "Looking for improvements in the project..."
          
          # Basit otomatik iyileştirme
          echo "\n## 🛠️ Auto Update by LostPengu" >> README.md
          echo "- Maintenance task completed at $(date)" >> README.md
          echo "- Code Agent is working automatically." >> README.md
          
          echo "Changes made successfully."
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Auto update by LostPengu Code Agent"
          title: "🤖 LostPengu Code Agent - Automatic Maintenance"
          body: "This pull request was created automatically by LostPengu Code Agent."
          branch: lostpengu-auto-update
          delete-branch: true
