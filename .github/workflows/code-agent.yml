name: LostPengu Code Agent

on:
  schedule:
    - cron: '*/40 * * * *'     # Her 40 dakikada bir
  workflow_dispatch:

jobs:
  code-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: LostPengu Code Agent
        run: |
          echo "🐧 LostPengu Code Agent is thinking..."
          echo "Time: $(date)"
          echo "Looking for improvements..."

          # Basit iyileştirme örneği
          echo "\n## 🛠️ Auto Improvement" >> README.md
          echo "- Auto update by LostPengu Code Agent at $(date)" >> README.md
          echo "- Small maintenance task completed." >> README.md
          
          echo "Changes detected. Creating Pull Request..."
        shell: bash

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "🤖 Auto update by LostPengu Code Agent"
          title: "🤖 LostPengu Code Agent - Maintenance Update"
          body: "This pull request was automatically created by LostPengu Code Agent."
          branch: lostpengu-code-update
