name: LostPengu Daily Agent

on:
  schedule:
    - cron: "0 */6 * * *"

  workflow_dispatch:

jobs:
  autonomous-update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Daily Agent
        run: |
          npx tsx agent/daily-agent.ts

      - name: Commit Autonomous Updates
        run: |
          git config --global user.name "LostPengu Agent"
          git config --global user.email "agent@lostpengu.ai"

          git add .

          git commit -m "🤖 Autonomous daily update" || echo "No changes"

          git push
